import os

config.suffixes = [".test"]

# The check lives in the LLVM source tree, which standalone compiler-rt builds
# may not have.
if not os.path.exists(
    os.path.join(
        getattr(config, "llvm_src_root", "") or "",
        "utils",
        "check_x86_cpu_model_abi.py",
    )
):
    config.unsupported = True
