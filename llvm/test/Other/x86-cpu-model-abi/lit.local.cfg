import os

# The check compares against compiler-rt sources, which are not present in
# standalone LLVM source distributions.
if not os.path.exists(
    os.path.join(
        config.llvm_src_root,
        "..",
        "compiler-rt",
        "lib",
        "builtins",
        "cpu_model",
        "x86.c",
    )
):
    config.unsupported = True
